# ==============================================================================
# RBAC for Python SRE Platform Operations Automation Engine
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: retail-store-ops-sa
  namespace: retail-store
  labels:
    app.kubernetes.io/name: ops-automation
    app.kubernetes.io/part-of: retail-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: retail-store-ops-role
  labels:
    app.kubernetes.io/name: ops-automation
rules:
  # Pod and node inspection
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "events", "services"]
    verbs: ["get", "list", "watch"]
  # Deployment rollout inspection & rollback execution
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/rollback", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: retail-store-ops-binding
  labels:
    app.kubernetes.io/name: ops-automation
roleRef:
  apiGroup: rbac.authorization.k8s.io/v1
  kind: ClusterRole
  name: retail-store-ops-role
subjects:
  - kind: ServiceAccount
    name: retail-store-ops-sa
    namespace: retail-store
