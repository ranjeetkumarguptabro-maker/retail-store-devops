# ==============================================================================
# In-Cluster Deployment for Python SRE Automation Exporter Daemon
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-automation-daemon
  namespace: retail-store
  labels:
    app.kubernetes.io/name: ops-automation
    app.kubernetes.io/component: sre-engine
    app.kubernetes.io/part-of: retail-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-automation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-automation
        app.kubernetes.io/component: sre-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9102"
    spec:
      serviceAccountName: retail-store-ops-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ops-engine
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - automation/ops_cli.py
            - export-metrics
            - --port
            - "9102"
            - --interval
            - "15"
            - --namespace
            - retail-store
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
