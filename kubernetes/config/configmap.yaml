apiVersion: v1
kind: ConfigMap
metadata:
  name: retail-store-config
  namespace: retail-store
  labels:
    app.kubernetes.io/name: retail-store-config
    app.kubernetes.io/part-of: retail-store
data:
  PORT: "8080"
  GIN_MODE: "release"
  SEARCH_ENABLED: "false"
  RETAIL_UI_SEARCH_ENABLED: "false"
  RETAIL_CATALOG_SEARCH_ENABLED: "false"
  RETAIL_UI_ENDPOINTS_CATALOG: "http://catalog.retail-store.svc.cluster.local:8080"
  RETAIL_UI_ENDPOINTS_CARTS: "http://cart.retail-store.svc.cluster.local:8080"
  RETAIL_UI_ENDPOINTS_CHECKOUT: "http://checkout.retail-store.svc.cluster.local:8080"
  RETAIL_UI_ENDPOINTS_ORDERS: "http://orders.retail-store.svc.cluster.local:8080"
  RETAIL_CHECKOUT_ENDPOINTS_ORDERS: "http://orders.retail-store.svc.cluster.local:8080"
  RETAIL_CATALOG_PERSISTENCE_PROVIDER: "in-memory"
  RETAIL_CART_PERSISTENCE_PROVIDER: "in-memory"
  RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: "in-memory"
  RETAIL_ORDERS_PERSISTENCE_PROVIDER: "in-memory"
  RETAIL_ORDERS_MESSAGING_PROVIDER: "in-memory"
