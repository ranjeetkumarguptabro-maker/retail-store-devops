<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181b1f"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="greenGauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="12" fill="#0b0c0e" stroke="#262a33" stroke-width="2"/>

  <!-- Grafana Header -->
  <rect x="0" y="0" width="1000" height="50" rx="12" fill="#181b1f"/>
  <circle cx="25" cy="25" r="10" fill="#f97316"/>
  <text x="50" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Grafana</text>
  <text x="120" y="31" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">/</text>
  <text x="135" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Retail Store Platform &amp; Availability SLO</text>
  <rect x="850" y="12" width="130" height="26" rx="4" fill="#22252b"/>
  <text x="915" y="29" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Last 30 days ▾</text>

  <!-- Panel 1: SLO Gauge -->
  <rect x="20" y="65" width="300" height="210" rx="6" fill="url(#panelBg)" stroke="#262a33"/>
  <text x="35" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">30-Day Rolling Availability SLO</text>
  <!-- Gauge Arc -->
  <path d="M 60 210 A 110 110 0 0 1 280 210" fill="none" stroke="#2c323d" stroke-width="22" stroke-linecap="round"/>
  <path d="M 60 210 A 110 110 0 0 1 276 200" fill="none" stroke="url(#greenGauge)" stroke-width="22" stroke-linecap="round"/>
  <text x="170" y="195" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" text-anchor="middle">99.4%</text>
  <text x="170" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Target: 99.0% | Error Budget: 60% Left</text>

  <!-- Panel 2: Request Rate -->
  <rect x="335" y="65" width="320" height="210" rx="6" fill="url(#panelBg)" stroke="#262a33"/>
  <text x="350" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">HTTP Request Throughput (req/s)</text>
  <polyline fill="none" stroke="#38bdf8" stroke-width="2.5" points="360,220 400,200 440,210 480,160 520,180 560,140 600,150 635,130"/>
  <text x="350" y="130" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">2,450 req/s</text>
  <text x="350" y="250" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">UI: 1,820 | Catalog: 410 | Cart: 220</text>

  <!-- Panel 3: HTTP 5xx Error Rate -->
  <rect x="670" y="65" width="310" height="210" rx="6" fill="url(#panelBg)" stroke="#262a33"/>
  <text x="685" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">HTTP 5xx Error Rate</text>
  <polyline fill="none" stroke="#ef4444" stroke-width="2" points="690,225 730,223 770,226 810,210 850,224 890,225 930,225 960,225"/>
  <text x="685" y="130" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">0.02%</text>
  <text x="685" y="155" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">✓ WELL BELOW 1.0% SLO THRESHOLD</text>

  <!-- Panel 4: p95 Latency by Service -->
  <rect x="20" y="290" width="475" height="210" rx="6" fill="url(#panelBg)" stroke="#262a33"/>
  <text x="35" y="315" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">p95 Latency by Service (ms)</text>
  <!-- Latency Bars -->
  <text x="35" y="348" fill="#e2e8f0" font-family="monospace" font-size="11">Storefront UI</text>
  <rect x="150" y="338" width="180" height="14" rx="3" fill="#38bdf8"/>
  <text x="340" y="349" fill="#38bdf8" font-family="monospace" font-size="11">42 ms</text>

  <text x="35" y="380" fill="#e2e8f0" font-family="monospace" font-size="11">Cart API</text>
  <rect x="150" y="370" width="90" height="14" rx="3" fill="#10b981"/>
  <text x="250" y="381" fill="#10b981" font-family="monospace" font-size="11">18 ms</text>

  <text x="35" y="412" fill="#e2e8f0" font-family="monospace" font-size="11">Catalog API</text>
  <rect x="150" y="402" width="70" height="14" rx="3" fill="#a78bfa"/>
  <text x="230" y="413" fill="#a78bfa" font-family="monospace" font-size="11">14 ms</text>

  <text x="35" y="444" fill="#e2e8f0" font-family="monospace" font-size="11">Checkout API</text>
  <rect x="150" y="434" width="110" height="14" rx="3" fill="#f59e0b"/>
  <text x="270" y="445" fill="#f59e0b" font-family="monospace" font-size="11">24 ms</text>

  <!-- Panel 5: SRE Automation & Pod Health -->
  <rect x="510" y="290" width="470" height="210" rx="6" fill="url(#panelBg)" stroke="#262a33"/>
  <text x="525" y="315" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SRE Platform Operations Status</text>
  <rect x="525" y="335" width="210" height="65" rx="4" fill="#111217" stroke="#22c55e"/>
  <text x="535" y="358" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">ACTIVE REPLICAS</text>
  <text x="535" y="388" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">10 / 10</text>

  <rect x="750" y="335" width="215" height="65" rx="4" fill="#111217" stroke="#38bdf8"/>
  <text x="760" y="358" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">AUTOMATION EXPORTER</text>
  <text x="760" y="388" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">LIVE (:9102)</text>

  <rect x="525" y="415" width="440" height="70" rx="4" fill="#111217" stroke="#262a33"/>
  <text x="540" y="438" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Last Incident Remediation: None Active (Cluster 100% Healthy)</text>
  <text x="540" y="462" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">CrashLoopBackOff: 0 | ImagePullBackOff: 0 | OOMKilled: 0 | Restarts: Normal</text>
</svg>
