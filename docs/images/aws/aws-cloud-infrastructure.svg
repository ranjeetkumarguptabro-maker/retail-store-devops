<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentAws" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="accentK8s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1000" height="60" rx="16" fill="#1e293b"/>
  <circle cx="30" cy="30" r="7" fill="#ef4444"/>
  <circle cx="50" cy="30" r="7" fill="#f59e0b"/>
  <circle cx="70" cy="30" r="7" fill="#10b981"/>
  <text x="500" y="37" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">AWS Cloud Infrastructure &amp; Amazon EKS Topology</text>

  <!-- AWS Region Box -->
  <rect x="30" y="80" width="940" height="410" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="105" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">AWS REGION: us-east-1 (N. Virginia)</text>

  <!-- VPC Container -->
  <rect x="50" y="120" width="900" height="350" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="145" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Virtual Private Cloud (VPC: 10.0.0.0/16)</text>

  <!-- Public Subnets Box -->
  <rect x="70" y="160" width="270" height="290" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="85" y="185" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Public Subnets (3x AZs)</text>
  <rect x="85" y="200" width="240" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="95" y="222" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Internet Gateway (IGW)</text>
  <text x="95" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">0.0.0.0/0 Direct Inbound</text>
  <rect x="85" y="280" width="240" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="95" y="302" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">NAT Gateways &amp; Elastic IPs</text>
  <text x="95" y="322" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Egress translation for private nodes</text>
  <rect x="85" y="360" width="240" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="95" y="382" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">AWS Application Load Balancer</text>
  <text x="95" y="402" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">HTTPS/443 External Ingress</text>

  <!-- Private Subnets & EKS Cluster Box -->
  <rect x="360" y="160" width="570" height="290" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="375" y="185" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Amazon EKS Cluster: dev-retail-store (v1.29)</text>

  <!-- EKS Control Plane -->
  <rect x="375" y="200" width="540" height="50" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="390" y="222" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Managed Control Plane &amp; API Server</text>
  <text x="390" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Private endpoint + Public OIDC GitHub Actions Authentication</text>

  <!-- Managed Worker Node Groups -->
  <rect x="375" y="265" width="260" height="170" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="390" y="288" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Managed Node Group (m5.large)</text>
  <text x="390" y="306" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Auto-Scaling: 2 Min - 6 Max Replicas</text>
  <rect x="390" y="320" width="230" height="30" rx="4" fill="#0f172a"/>
  <text x="400" y="340" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Pod: Storefront UI (Java 21)</text>
  <rect x="390" y="355" width="230" height="30" rx="4" fill="#0f172a"/>
  <text x="400" y="375" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Pod: Cart API (Java 21)</text>
  <rect x="390" y="390" width="230" height="30" rx="4" fill="#0f172a"/>
  <text x="400" y="410" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Pod: Catalog API (Go Gin)</text>

  <!-- Supporting Services -->
  <rect x="650" y="265" width="265" height="170" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="665" y="288" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Supporting Services &amp; SRE Engine</text>
  <rect x="665" y="305" width="235" height="35" rx="4" fill="#0f172a"/>
  <text x="675" y="325" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Amazon ECR (5 Repositories)</text>
  <rect x="665" y="345" width="235" height="35" rx="4" fill="#0f172a"/>
  <text x="675" y="365" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">SRE Ops Daemon (Port 9102)</text>
  <rect x="665" y="385" width="235" height="35" rx="4" fill="#0f172a"/>
  <text x="675" y="405" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Prometheus &amp; Grafana Stack</text>
</svg>
