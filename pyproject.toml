[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-store-automation"
version = "2.0.0"
description = "Platform Operations and SRE Automation Engine for Retail Store on Kubernetes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kubernetes>=28.1.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.19.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["automation/tests"]
addopts = "-v"
markers = [
    "unit: Fast unit tests with mocked Kubernetes API",
    "integration: Integration tests requiring active Kubernetes cluster (kind or Minikube)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "application",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
