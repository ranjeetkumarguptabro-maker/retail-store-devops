name: "Continuous Deployment (AWS EKS)"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-eks:
    name: "Deploy to Amazon EKS"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests Syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "
          import glob, yaml
          for path in sorted(glob.glob('kubernetes/**/*.yaml', recursive=True)):
              with open(path) as f:
                  list(yaml.safe_load_all(f))
              print(f'✓ Validated: {path}')
          print('All Kubernetes manifests validated successfully!')
          "

      - name: Check AWS Deployment Credentials
        id: check-creds
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice::AWS_ROLE_ARN secret is not configured. Manifest validation passed. Skipping live cloud deployment until AWS EKS is provisioned."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials via OIDC
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Connect to Amazon EKS Cluster & Deploy
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name dev-retail-store

          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/config/configmap.yaml
          kubectl apply -f kubernetes/catalog/deployment.yaml
          kubectl apply -f kubernetes/cart/deployment.yaml
          kubectl apply -f kubernetes/checkout/deployment.yaml
          kubectl apply -f kubernetes/orders/deployment.yaml
          kubectl apply -f kubernetes/ui/deployment.yaml

          kubectl rollout status deployment/ui -n retail-store --timeout=120s
