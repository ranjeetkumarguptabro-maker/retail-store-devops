name: "Continuous Integration"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: "Build & Test Microservices"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Catalog Service (Go)
        run: |
          cd application/src/catalog
          go test -v ./...

      - name: Test UI Service (Java / Maven)
        run: |
          cd application/src/ui
          chmod +x mvnw
          ./mvnw test -q

      - name: Build Verification (Docker Compose Syntax)
        run: |
          docker compose -f docker/docker-compose.yml config
