name: "Continuous Integration"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: "Build & Test Microservices"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Catalog Service (Go)
        run: |
          cd application/src/catalog
          go test -v ./...

      - name: Test UI Service (Java / Maven)
        run: |
          cd application/src/ui
          chmod +x mvnw
          ./mvnw test -q

      - name: Build Verification (Docker Compose Syntax)
        run: |
          docker compose -f docker/docker-compose.yml config

  python-operations-engine:
    name: "Test & Lint Python SRE Automation Engine"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check automation/

      - name: Run Unit Tests & Code Coverage
        run: |
          pytest automation/tests -m "not integration" --cov=automation --cov-report=term-missing

      - name: Verify Unified SRE CLI & Lifecycle Commands
        run: |
          python automation/ops_cli.py --help
          python automation/ops_cli.py incident-lifecycle --help

  terraform-lint-and-validate:
    name: "Terraform Formatting & Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/modules/ terraform/environments/dev/

      - name: Terraform Init (No Backend)
        run: |
          terraform -chdir=terraform/environments/dev init -backend=false

      - name: Terraform Validate
        run: |
          terraform -chdir=terraform/environments/dev validate
